name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches package version
        run: |
          package_version="$(uv run --locked python -c 'import euler_metric_naming; print(euler_metric_naming.__version__)')"
          test "${GITHUB_REF_NAME#v}" = "$package_version"

      - name: Build package
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        run: uv publish
