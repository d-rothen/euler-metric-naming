[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-metric-naming"
version = "0.6.0"
description = "Build self-describing metric names for the Euler ML ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com"},
]
keywords = [
    "machine-learning",
    "metrics",
    "experiment-tracking",
    "observability",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The suite's dependency-free contract: modality registry and the extension
# protocol vocabularies are installed through.
dependencies = ["euler-dataset-contract>=0.23.0"]

[project.urls]
Homepage = "https://github.com/d-rothen/euler-metric-naming"
Repository = "https://github.com/d-rothen/euler-metric-naming"
Issues = "https://github.com/d-rothen/euler-metric-naming/issues"
Documentation = "https://github.com/d-rothen/euler-metric-naming#readme"

[project.optional-dependencies]
dev = [
    "jsonschema>=4.18",
    "pytest>=7",
    "ruff>=0.2",
]

# euler-suite report: what this installation can do (metric_vocabulary_report).
[project.entry-points."euler.capabilities"]
euler-metric-naming = "euler_metric_naming.capabilities:capability_report"

[tool.setuptools.packages.find]
include = ["euler_metric_naming*"]

[tool.setuptools.package-data]
euler_metric_naming = [
    "py.typed",
    "contract/schema/*.json",
    "contract/vocabularies/*.json",
    "contract/legacy/*.json",
    "contract/ts/*.ts",
    "contract/fixtures/*.json",
    "contract/fixtures/*.md",
    "contract/fixtures/evals/*.json",
    "contract/fixtures/training/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
